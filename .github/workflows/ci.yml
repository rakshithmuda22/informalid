# Runs on every push and pull request. No API key is needed: tests and the demo run offline.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: flake8 config.py core demo tests --max-line-length=120 --ignore=E501,W503

      - name: Tests
        run: pytest tests/ -v --tb=short

      - name: Offline demo (full 7-question flow)
        run: python demo/demo.py --persona both
        env:
          INFORMALID_MODE: mock
